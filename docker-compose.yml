services:
  pms-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
        VITE_CHAT_API_BASE_URL: ${VITE_CHAT_API_BASE_URL:-http://localhost:3001}
        VITE_CHAT_WS_URL: ${VITE_CHAT_WS_URL:-ws://localhost:3001}
        VITE_GEOAPIFY_API_KEY: ${VITE_GEOAPIFY_API_KEY:-}
        VITE_N8N_WEBHOOK_URL: ${VITE_N8N_WEBHOOK_URL:-}
        VITE_N8N_RAG_CHAT_URL: ${VITE_N8N_RAG_CHAT_URL:-}
    container_name: pms-frontend
    ports:
      - "5741:5741"
    restart: unless-stopped
